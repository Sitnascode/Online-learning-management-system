<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Course - LMS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <h1>Create a New Course</h1>
      </div>
    </header>

    <section class="create-course-form">
      <div class="container">
        <form action="create_course.php" method="POST">
          <label for="course-title">Course Title</label>
          <input type="text" id="course-title" name="title" required />

          <label for="course-description">Course Description</label>
          <textarea
            id="course-description"
            name="description"
            rows="4"
            required
          ></textarea>

          <label for="course-materials">Upload Course Materials</label>
          <input
            type="file"
            id="course-materials"
            name="course-materials"
            multiple
          />

          <button type="submit" class="btn">Create Course</button>
        </form>
      </div>
    </section>

    <footer>
      <div class="container">
        <p>&copy; 2025 Learning Management System</p>
      </div>
    </footer>
  </body>
</html>
