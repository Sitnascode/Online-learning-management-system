<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Dashboard - LMS</title>
    <link rel="stylesheet" href="styles.css" /></head
  ><style>
    /* Styling for Header */
    header {
      background-color: #0d47a1; /* Deep blue for header background */
      color: white; /* White text for readability */
      padding: 20px 0; /* Spacing inside header */
      text-align: center;
      border-bottom: 4px solid #1e88e5; /* Decorative border */
    }

    header h1 {
      font-size: 2.5rem; /* Larger text for the main header */
      font-weight: bold;
    }

    nav ul {
      list-style: none; /* Remove bullets */
      display: flex;
      justify-content: center; /* Center align navigation */
      margin-top: 15px; /* Spacing above navigation */
    }

    nav ul li {
      margin: 0 10px;
    }

    nav ul li a {
      text-decoration: none;
      color: #ffffff;
      background-color: #1e88e5; /* Bright blue for button-like links */
      padding: 10px 20px;
      border-radius: 5px; /* Rounded corners */
      font-size: 1rem; /* Slightly larger font */
      transition: background-color 0.3s ease;
    }

    nav ul li a:hover {
      background-color: #1565c0; /* Darker blue on hover */
      color: white;
    }

    /* Dashboard Section */
    .dashboard {
      margin: 30px 0; /* Spacing above and below dashboard */
    }

    .dashboard h2 {
      font-size: 2rem;
      color: #1565c0; /* Bright blue for titles */
      text-align: center;
      margin-bottom: 20px; /* Spacing below the heading */
    }

    .course-list {
      display: flex;
      flex-wrap: wrap; /* Allow courses to wrap in smaller screens */
      justify-content: center; /* Center-align course items */
      gap: 20px; /* Space between course items */
    }

    .course-item {
      background: #e3f2fd; /* Light blue for a clean background */
      border: 2px solid #64b5f6; /* Soft border for distinction */
      border-radius: 10px;
      box-shadow: 2px 4px 10px rgba(0, 0, 0, 0.1); /* Subtle shadow for depth */
      padding: 15px;
      width: 300px; /* Fixed width for items */
      text-align: center; /* Center align text inside items */
    }

    .course-item h3 {
      font-size: 1.2rem;
      color: #1565c0; /* Bright blue */
      margin-bottom: 10px;
    }

    .course-item .btn {
      background-color: #1e88e5;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .course-item .btn:hover {
      background-color: #0d47a1; /* Darker blue for hover effect */
      transform: scale(1.05); /* Slight zoom effect */
    }

    /* Footer Styling */
    footer {
      background-color: #0d47a1; /* Deep blue */
      color: white; /* White text for contrast */
      padding: 10px 0;
      text-align: center;
      font-size: 0.9rem; /* Slightly smaller font for footer */
    }

    footer p {
      margin: 0;
    }
  </style>
  <body>
    <header>
      <div class="container">
        <h1>Welcome, Student</h1>
        <nav>
          <ul>
            <li><a href="assignment.html">Assignments</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="logout.php">Logout</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <section class="dashboard">
      <div class="container">
        <h2>Your Enrolled Courses</h2>
        <!-- Course List for Student -->
        <div class="course-list">
          <div class="course-item">
            <h3>Course 1: Web Development</h3>
            <a href="assignment.html" class="btn">Submit Assignment</a>
          </div>
          <div class="course-item">
            <h3>Course 2: Data Science</h3>

            <a href="assignment.html" class="btn">Submit Assignment</a>
          </div>
          <!-- More courses for students -->
        </div>
      </div>
    </section>

    <footer>
      <div class="container">
        <p>&copy; 2025 Learning Management System</p>
      </div>
    </footer>
  </body>
</html>
