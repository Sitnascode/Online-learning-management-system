<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher Dashboard - LMS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <style>
nav ul li a {
  background-color: #1a237e;
  border-radius: 5px;
  padding: 10px 15px;
  text-transform: uppercase;
}

nav ul li a:hover {
  background-color: #0d47a1;
  color: #fff;
}


.course-item {
  background: #e3f2fd;
  border: 2px solid #64b5f6; 
  border-radius: 10px; 
  padding: 15px;
  margin-bottom: 15px;
  box-shadow: 2px 4px 10px rgba(0, 0, 0, 0.1); 
}

.course-item h3 {
  font-size: 1.4rem; 
}

.course-item .btn {
  background-color: #1e88e5; 
  color: #fff; 
  padding: 10px 20px; 
  text-transform: uppercase; 
  border-radius: 5px; 
}

.course-item .btn:hover {
  background-color: #1565c0; 
  transform: scale(1.05); 
}


.dashboard {
  display: flex;
  flex-wrap: wrap; 
  justify-content: space-around; 
  gap: 20px; 
  margin-top: 40px;
}

.dashboard .course-item {
  flex-basis: 48%; 
  max-width: 48%;
}

.dashboard .course-item h3 {
  font-weight: bold; 
  text-align: center; 
}

footer {
  padding: 20px;
  text-align: center;
  font-size: 0.9rem; 
  color: rgba(255, 255, 255, 0.8);
  background-color: #1a237e; 
}

footer p {
  margin: 0;
}</style>
</html>
</html>
  <body>
    <header>
      <div class="container">
        <h1>Welcome, Teacher</h1>
        <nav>
          <ul>
            <li><a href="courses.html">Create Courses</a></li>
            <li><a href="manageCourse.html">Manage Courses</a></li>
            <li><a href="upload_material.html">Upload material</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="logout.html">Logout</a></li>

          </ul>
        </nav>
      </div>
    </header>

    <section class="dashboard">
      <div class="container">
        <h2>Your Courses</h2>
        <!-- Course Management Section for Teacher -->
        <div class="course-list">
          <div class="course-item">
            <h3>Course 1: Web Development</h3>
            <a href="manageCourse.html" class="btn">Manage Course</a>
          </div>
          <div class="course-item">
            <h3>Course 2: Data Science</h3>
            <a href="manage_course.html" class="btn">Manage Course</a>
          </div>
          <!-- More courses for teachers -->
        </div>
      </div>
    </section>

    <footer>
      <div class="container">
        <p>&copy; 2025 Learning Management System</p>
      </div>
    </footer>
  </body>
</html>
