<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Submit Assignment - LMS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <h1>Submit Your Assignment</h1>
      </div>
    </header>

    <section class="submit-assignment">
      <div class="container">
        <form
          action="submit _assignment.php"
          method="POST"
          enctype="multipart/form-data"
        >
          <label for="assignment-file">Upload Your Assignment</label>
          <input
            type="file"
            id="assignment-file"
            name="assignment-file"
            required
          />

          <button type="submit" class="btn">Submit Assignment</button>
        </form>
      </div>
    </section>

    <footer>
      <div class="container">
        <p>&copy; 2025 Learning Management System</p>
      </div>
    </footer>
  </body>
</html>
