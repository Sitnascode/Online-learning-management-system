<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Courses - LMS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <style>
    .manage-courses {
      margin: 40px 0;
      padding: 20px;
      background: #e3f2fd;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .manage-courses .container {
      text-align: center;
    }

    .manage-courses h1 {
      font-size: 2rem;
      color: #1565c0;
      margin-bottom: 20px;
    }

    .course-list {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .course-item {
      background: #ffffff;
      border: 1px solid #dce775;
      border-radius: 8px;
      box-shadow: 2px 4px 8px rgba(0, 0, 0, 0.1);
      padding: 15px;
      width: 300px;
      text-align: center;
    }

    .course-item h3 {
      font-size: 1.5rem;
      color: #2c3e50;
      margin-bottom: 15px;
    }

    .course-item .btn {
      display: inline-block;
      margin: 5px 10px;
      padding: 10px 20px;
      background-color: #1e88e5;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
      font-size: 1rem;
      font-weight: bold;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .course-item .btn:hover {
      background-color: #1565c0;
      transform: scale(1.05);
    }

    @media (max-width: 768px) {
      .course-item {
        width: 100%;
      }
    }
  </style>
  <body>
    <header>
      <div class="container">
        <h1>Manage Your Courses</h1>
      </div>
    </header>

    <section class="manage-courses">
      <div class="container">
        <div class="course-list">
         
            <div class="course-item">
                <h3>Course 1: Web Development</h3>
                <a href="edit-course.php?id=1" class="btn">Edit</a>
                <a href="delete-course.php?id=1" class="btn">Delete</a>
            </div>
            
          </div>
          <div class="course-item">
            <h3>Course 2: Data Science</h3>
            <a href="edit-course.php?id=2" class="btn">Edit</a>
            <a href="delete-course.php?id=2" class="btn">Delete</a>
          </div>
          <!-- Additional courses listed here -->
        </div>
      </div>
    </section>

    <footer>
      <div class="container">
        <p>&copy; 2025 Learning Management System</p>
      </div>
    </footer>
  </body>
</html>
